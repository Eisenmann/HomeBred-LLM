name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: HomeBred-LLM/HomeBred-LLM.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64,   archive: tar.gz }
          - { os: windows-latest, rid: win-x64,     archive: zip }
          - { os: macos-latest,   rid: osx-arm64,   archive: tar.gz }
          - { os: macos-latest,   rid: osx-x64,     archive: tar.gz }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} -r ${{ matrix.rid }} --configfile .github/nuget.ci.config

      - name: Publish (self-contained)
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r ${{ matrix.rid }}
          --self-contained --no-restore -o publish/${{ matrix.rid }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf HomeBred-LLM-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "HomeBred-LLM-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: HomeBred-LLM-${{ matrix.rid }}
          path: HomeBred-LLM-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
